<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d9488" />
    <meta
      name="description"
      content="Monitor de calidad del aire, clima, energía e incendios para Santa Marta, Colombia."
    />
    <title>ClimaBot · Santa Marta</title>

    <!-- Evita el parpadeo de tema: aplica el tema guardado antes de pintar. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('tema');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
          document.documentElement.classList.toggle('dark', t === 'oscuro');
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
