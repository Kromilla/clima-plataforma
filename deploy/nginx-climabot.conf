# nginx para ClimaBot — sirve el dashboard compilado y hace proxy de /api al backend.
# El frontend llama a rutas /api relativas, así que todo queda en el mismo origen
# (sin CORS). Copiar a /etc/nginx/sites-available/climabot y enlazar en sites-enabled.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Dashboard compilado (Vite → dist).
    root /home/ubuntu/clima-plataforma/dashboard-ui/dist;
    index index.html;

    # SPA: cualquier ruta desconocida sirve index.html (React Router en el cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → uvicorn en localhost:8000.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Cachear los assets con hash (Vite les pone huella en el nombre).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
