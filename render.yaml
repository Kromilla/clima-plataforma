# render.yaml — Blueprint de Render (opción A, plan free).
#
# Solo la API. El collector NO va aquí: los cron jobs de Render son de pago. Se
# ejecuta como workflow programado de GitHub Actions
# (.github/workflows/collector.yml), que es gratis y escribe directo a Supabase.
#
# Las variables `sync: false` se ingresan en el panel de Render (no van al repo).

services:
  - type: web
    name: climabot-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/lugares
    envVars:
      - key: DATABASE_URL          # Supabase (Session pooler)
        sync: false
      - key: TELEGRAM_BOT_TOKEN    # config.py lo exige al importar
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FIRMS_MAP_KEY         # opcional (mapa de incendios)
        sync: false
      - key: CORS_ORIGINS          # restringido al dominio del dashboard (Vercel)
        value: https://clima-plataforma.vercel.app
